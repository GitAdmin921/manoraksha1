<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>District Dashboard | ManoRaksha</title><link rel="stylesheet" href="/css/app.css"></head><body><nav><b>ManoRaksha / District</b><button onclick="logout()">Sign out</button></nav><main class="container"><div class="top"><div><span class="badge">District analytics</span><h1>District dashboard</h1><p class="muted">Aggregated, role-filtered data. Sensitive fields are masked by policy.</p></div></div><section class="stats" id="stats"></section><section class="grid two"><article class="panel"><h2>Risk distribution</h2><div id="risk"></div></article><article class="panel"><h2>Recent events</h2><div id="events"></div></article></section></main><script src="/js/dashboard.js"></script><script>
async function load(){try{const d=await api('/api/dashboard/overview');stats.innerHTML=`<div><b>${d.totalCases}</b><span>Cases</span></div><div><b>${d.urgent}</b><span>Urgent</span></div><div><b>${d.elevated}</b><span>Elevated</span></div><div><b>${d.pending}</b><span>Pending</span></div>`;risk.innerHTML=Object.entries(d.risk||{}).map(([k,v])=>`<p><b>${k}</b> — ${v}</p>`).join('');events.innerHTML=(d.events||[]).map(e=>`<div class="row"><span>${e.type}</span><small>${new Date(e.created_at).toLocaleString()}</small></div>`).join('')||'No recent events.'}catch(e){stats.textContent=e.message}}load();
</script></body></html>
