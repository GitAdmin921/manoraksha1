<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Wellbeing | ManoRaksha</title><link rel="stylesheet" href="/css/app.css"></head><body>
<nav><b>ManoRaksha</b><button onclick="logout()">Sign out</button></nav><main class="container"><div class="top"><div><span class="badge">Beneficiary</span><h1 id="hello">Your wellbeing</h1><p class="muted">Your responses help identify support needs over time.</p></div><button class="panic" onclick="emergency()">🚨 I NEED IMMEDIATE HELP</button></div>
<section class="grid two"><article class="panel"><h2>Check-in</h2><label>Language<select id="language"><option>English</option><option>Hindi</option><option>Gujarati</option><option>Marathi</option><option>Bengali</option><option>Tamil</option><option>Telugu</option><option>Kannada</option><option>Malayalam</option><option>Punjabi</option><option>Odia</option><option>Assamese</option></select></label>
<label>Mood <span id="moodv">3</span>/5<input id="mood" type="range" min="1" max="5" value="3" oninput="moodv.textContent=this.value"></label>
<label>Anxiety <span id="anxv">3</span>/5<input id="anxiety" type="range" min="1" max="5" value="3" oninput="anxv.textContent=this.value"></label>
<label>Sleep difficulty <span id="sleepv">3</span>/5<input id="sleep" type="range" min="1" max="5" value="3" oninput="sleepv.textContent=this.value"></label>
<label>Do you currently feel unsafe?<select id="safety"><option value="false">No</option><option value="true">Yes</option></select></label>
<label>Anything you want support with?<textarea id="message" maxlength="3000"></textarea></label><button class="btn primary" onclick="submitCheckin()">Submit privately</button><p id="result"></p></article>
<article class="panel"><h2>Privacy controls</h2><label><input type="checkbox" id="analytics" checked> Allow wellbeing analytics</label><label><input type="checkbox" id="voice" checked> Allow voice analysis</label><label><input type="checkbox" id="longitudinal" checked> Allow longitudinal trend analysis</label><label><input type="checkbox" id="counsellor" checked> Allow assigned counsellor access</label><button class="btn" onclick="savePrivacy()">Save preferences</button><hr><button class="btn danger full" onclick="privacyLock()">🔒 Privacy Lock</button><p class="muted small">The lock disables optional processing/sharing. Necessary safety and audit records may still be retained.</p></article></section></main>
<script src="/js/dashboard.js"></script><script>
async function init(){const d=await me();hello.textContent='Hello, '+(d.user.display_name||'there');}
async function submitCheckin(){try{const d=await api('/api/checkins',{method:'POST',body:JSON.stringify({language:language.value,mood:+mood.value,anxiety:+anxiety.value,sleep_difficulty:+sleep.value,feels_unsafe:safety.value==='true',message:message.value})});result.className='success';result.textContent='Support signal: '+d.ai.level+' — '+d.ai.explanation;loadPrivacy()}catch(e){result.className='error';result.textContent=e.message}}
async function loadPrivacy(){const d=await api('/api/privacy');for(const k of ['analytics','voice','longitudinal','counsellor'])document.getElementById(k).checked=!!d[k]}
async function savePrivacy(){try{await api('/api/privacy',{method:'PUT',body:JSON.stringify({analytics:analytics.checked,voice:voice.checked,longitudinal:longitudinal.checked,counsellor_access:counsellor.checked})});alert('Privacy preferences saved')}catch(e){alert(e.message)}}
async function privacyLock(){try{await api('/api/privacy/lock',{method:'POST'});await loadPrivacy();alert('Privacy Lock enabled. Optional processing is disabled.')}catch(e){alert(e.message)}}
init();loadPrivacy();
</script></body></html>
