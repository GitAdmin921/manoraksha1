<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counsellor | ManoRaksha</title><link rel="stylesheet" href="/css/app.css"></head><body><nav><b>ManoRaksha / Counsellor</b><button onclick="logout()">Sign out</button></nav><main class="container"><div class="top"><div><span class="badge">Human responder</span><h1>Counsellor dashboard</h1><p class="muted">Assigned cases and live support events.</p></div></div><section class="stats" id="stats"></section><section class="panel"><h2>Priority cases</h2><div id="cases">Loading…</div></section></main><script src="/js/dashboard.js"></script><script src="/socket.io/socket.io.js"></script><script>
async function load(){try{const d=await api('/api/dashboard/overview');stats.innerHTML=`<div><b>${d.totalCases}</b><span>Cases</span></div><div><b>${d.urgent}</b><span>Urgent</span></div><div><b>${d.elevated}</b><span>Elevated</span></div><div><b>${d.pending}</b><span>Pending</span></div>`;cases.innerHTML=d.cases.map(c=>`<div class="row"><b>${c.case_id}</b><span>${c.level}</span><span>${c.status}</span><small>${new Date(c.created_at).toLocaleString()}</small></div>`).join('')||'No priority cases.'}catch(e){cases.textContent=e.message}}load();const socket=io({auth:{token}});socket.on('emergency.created',()=>{load();alert('🚨 New emergency request')});socket.on('risk.updated',load);
</script></body></html>
